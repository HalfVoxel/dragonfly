[package]
name = "dragonfly"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dragonfly"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
html-escape = "0.2.13"
dialoguer = "0.11"
libc = "0.2"
strip-ansi-escapes = "0.2.1"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
