name: ci
on:
  pull_request:
  push:
    # watch-mcp-channel: temporary, lets the dragonfly-watcher E2E test see
    # real check runs on this branch without a PR. Remove before merge.
    branches: [main, watch-mcp-channel]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
